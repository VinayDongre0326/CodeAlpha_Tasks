<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>jQuery Mobile Website</title>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>

  <!-- jQuery Mobile CSS -->
  <link rel="stylesheet"
    href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">

  <!-- jQuery Mobile JS -->
  <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>

</head>

<body>

  <!-- Page -->
  <div data-role="page" id="home">

    <!-- Header -->
    <div data-role="header" data-theme="b">

      <h1>Mobile Website</h1>

    </div>

    <!-- Main Content -->
    <div data-role="main" class="ui-content">

      <h2>Welcome Student</h2>

      <p>
        This is a simple mobile website created using jQuery Mobile.
      </p>

      <!-- Buttons -->

      <a href="#about"
        class="ui-btn ui-btn-b ui-corner-all ui-shadow">

        About

      </a>

      <a href="#contact"
        class="ui-btn ui-btn-success ui-corner-all ui-shadow">

        Contact

      </a>

    </div>

    <!-- Footer -->
    <div data-role="footer" data-position="fixed" data-theme="b">

      <h4>© 2026 Mobile Website</h4>

    </div>

  </div>


  <!-- About Page -->

  <div data-role="page" id="about">

    <div data-role="header" data-theme="b">

      <a href="#home"
        data-icon="back">

        Back

      </a>

      <h1>About</h1>

    </div>

    <div data-role="main" class="ui-content">

      <p>
        jQuery Mobile is used to create responsive mobile-friendly websites.
      </p>

    </div>

    <div data-role="footer" data-position="fixed" data-theme="b">

      <h4>About Page</h4>

    </div>

  </div>


  <!-- Contact Page -->

  <div data-role="page" id="contact">

    <div data-role="header" data-theme="b">

      <a href="#home"
        data-icon="back">

        Back

      </a>

      <h1>Contact</h1>

    </div>

    <div data-role="main" class="ui-content">

      <form>

        <label>Name:</label>

        <input type="text" placeholder="Enter your name">

        <label>Email:</label>

        <input type="email" placeholder="Enter your email">

        <label>Message:</label>

        <textarea placeholder="Enter message"></textarea>

        <button class="ui-btn ui-btn-b">

          Submit

        </button>

      </form>

    </div>

    <div data-role="footer" data-position="fixed" data-theme="b">

      <h4>Contact Page</h4>

    </div>

  </div>

</body>

</html>
