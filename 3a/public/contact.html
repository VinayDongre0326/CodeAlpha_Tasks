<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>

  <style>

    body{
      font-family: Arial;
      text-align: center;
      background-color: #f2f2f2;
      margin: 0;
    }

    nav{
      background-color: #333;
      padding: 15px;
    }

    nav a{
      color: white;
      text-decoration: none;
      margin: 20px;
      font-size: 18px;
    }

    .container{
      margin-top: 100px;
    }

    input, textarea{
      width: 300px;
      padding: 10px;
      margin: 10px;
    }

    button{
      padding: 10px 20px;
      background-color: #333;
      color: white;
      border: none;
      cursor: pointer;
    }

  </style>

</head>

<body>

  <nav>

    <a href="/">Home</a>

    <a href="/about">About</a>

    <a href="/contact">Contact</a>

  </nav>

  <div class="container">

    <h1>Contact Page</h1>

    <form>

      <input type="text" placeholder="Enter Name">

      <br>

      <input type="email" placeholder="Enter Email">

      <br>

      <textarea placeholder="Enter Message"></textarea>

      <br>

      <button type="button">Submit</button>

    </form>

  </div>

</body>

</html>
